version: "3"
services:
  ynet-app:
    build: .
    container_name: ynet-app
    image: romliani/ynet-app:latest
    ports:
      - "5000:5000"

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    ports:
      - "3000:3000"